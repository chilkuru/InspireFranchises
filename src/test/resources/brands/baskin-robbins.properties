# =============================================================================
# brands/baskin-robbins.properties — Baskin-Robbins brand configuration
# Source: https://www.franchising.inspirebrands.com/baskin-robbins
# =============================================================================

# ── Page URL ──────────────────────────────────────────────────────────────────
brand.page.url=/baskin-robbins

# ── Expected text / assertions ────────────────────────────────────────────────
brand.display.name=Baskin-Robbins
brand.hero.heading=Franchise with Baskin-Robbins
brand.why.heading=Why Baskin-Robbins?
brand.section.anything.possible=Anything is possible with Baskin-Robbins

# Qualification requirements
brand.liquid.assets=100,000
brand.net.worth=200,000

# Restaurant formats (BR has 4: Free Standing, Endcap, Inline, Small Format)
brand.format.freestanding=Free Standing
brand.format.endcap=Endcap
brand.format.inline=Inline
brand.format.smallformat=Small Format

# Awards
brand.award.entrepreneur=Entrepreneur Best of the Best
brand.award.franchise500=Franchise 500
brand.award.topfood=Top Food

# GET STARTED link must contain this brand query parameter
brand.get.started.param=Baskin

# Factoid — world's largest ice cream specialty chain
brand.shop.count=7,800
